media:
  - name: news_images
    label: News Images
    input: public/images/news
    output: /images/news
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

content:
  - name: news
    label: News
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename:
      template: "{date}-{title}.md"
      field: false
    view:
      primary: title
      fields: [date, category, featured]
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Lab News
            - Publication
            - Research
            - Seminar
            - Conference
            - Award
            - Recruitment
      - name: summary
        label: Summary
        type: text
        required: true
      - name: image
        label: Featured Image
        type: image
        required: false
        options:
          media: news_images
      - name: gallery
        label: Gallery Images
        type: image
        required: false
        options:
          media: news_images
          multiple: true
      - name: featured
        label: Featured
        type: boolean
        required: false
      - name: body
        label: Content
        type: rich-text
        required: false
        options:
          format: markdown
          media: news_images
          switcher: true

settings:
  content:
    merge: true
  commit:
    identity: app
